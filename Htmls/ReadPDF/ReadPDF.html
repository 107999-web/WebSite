<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 線上閱讀器</title>
    <!-- Tailwind CSS 樣式框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- 頂部標題列 -->
    <header class="bg-indigo-600 text-white shadow-md px-6 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-3">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <h1 class="text-xl font-bold tracking-wide">PDF 線上閱讀平台</h1>
        </div>
        <div class="text-sm bg-indigo-700 px-3 py-1 rounded-full shadow-inner">
            目錄路徑：<code class="font-mono">./PDF/</code>
        </div>
    </header>

    <!-- 主內容區 -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- 左側：PDF 檔案清單 -->
        <aside class="w-80 bg-white border-r border-gray-200 flex flex-col shrink-0">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    檔案清單
                </h2>
                <span id="file-count" class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium">0 個檔案</span>
            </div>

            <!-- 清單項目容器 -->
            <div id="pdf-list" class="flex-1 overflow-y-auto divide-y divide-gray-100 p-2">
                <!-- 動態載入項目 -->
                <div class="p-4 text-center text-gray-400 text-sm">正在掃描 PDF 目錄...</div>
            </div>

            <!-- 備用手動設定面板（當伺服器無法自動讀取目錄清單時可在此直接編輯檔名） -->
            <div class="p-3 bg-gray-50 border-t border-gray-200 text-xs">
                <details>
                    <summary class="cursor-pointer font-medium text-indigo-600 hover:text-indigo-800">⚙️ 若自動抓取失敗？點此手動設定清單</summary>
                    <div class="mt-2 space-y-2">
                        <p class="text-gray-500">請每行輸入一個 PDF 檔名（不需包含資料夾路徑）：</p>
                        <textarea id="manual-list-input" rows="4" class="w-full p-2 border rounded text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none font-mono" placeholder="file1.pdf&#10;file2.pdf"></textarea>
                        <button onclick="applyManualList()" class="w-full bg-indigo-600 text-white py-1 rounded hover:bg-indigo-700 transition">套用清單</button>
                    </div>
                </details>
            </div>
        </aside>

        <!-- 右側：PDF 預覽檢視器 -->
        <main class="flex-1 bg-gray-100 flex flex-col relative overflow-hidden">
            <!-- 預設提示狀態 -->
            <div id="welcome-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 p-6 text-center">
                <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-lg font-medium text-gray-600">請從左側選擇一個 PDF 檔案開始閱讀</p>
                <p class="text-sm text-gray-400 mt-1">點擊後將直接在此區域載入檢視</p>
            </div>

            <!-- PDF 嵌入 iframe -->
            <iframe id="pdf-viewer" class="w-full h-full border-none hidden" title="PDF Viewer"></iframe>
        </main>
    </div>

    <!-- 邏輯運作 Script -->
    <script>
        const FOLDER_PATH = './PDF/';
        
        // 預設常見檔案或手動陣列（當無法自動抓取時的備用候選，你也可以直接在這裡寫死檔名陣列）
        let defaultFiles = [];

        async function init() {
            let files = [];
            try {
                // 嘗試抓取伺服器目錄索引（GitHub Pages 預設可能不支援目錄列表，會進入 catch）
                const response = await fetch(FOLDER_PATH);
                const text = await response.text();
                
                // 解析 HTML 目錄回應以提取 .pdf 連結
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = doc.querySelectorAll('a');
                
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && href.toLowerCase().endsWith('.pdf')) {
                        // 移除路徑只保留純檔名或相對路徑
                        const fileName = decodeURIComponent(href.split('/').pop());
                        if (fileName && !files.includes(fileName)) {
                            files.push(fileName);
                        }
                    }
                });
            } catch (error) {
                console.log('無法直接讀取目錄索引，啟用備用或手動模式。');
            }

            // 如果自動抓取不到檔案（GitHub Pages 常見限制），載入備用預設檔案或提示
            if (files.length === 0) {
                // 你可以在此處直接填入你的 PDF 檔名作為備用陣列，例如：['範例文件1.pdf', '範例文件2.pdf']
                files = defaultFiles; 
            }

            renderFileList(files);
        }

        // 渲染檔案清單到畫面上
        function renderFileList(files) {
            const listContainer = document.getElementById('pdf-list');
            const fileCountBadge = document.getElementById('file-count');
            
            fileCountBadge.textContent = `${files.length} 個檔案`;
            listContainer.innerHTML = '';

            if (files.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-4 text-center text-gray-500 text-sm">
                        <p class="font-medium mb-1">找不到 PDF 檔案</p>
                        <p class="text-xs text-gray-400">請確認 <code class="bg-gray-100 px-1 py-0.5 rounded">./PDF/</code> 資料夾內是否有 PDF，或使用左下角「手動設定清單」輸入檔名。</p>
                    </div>
                `;
                return;
            }

            files.forEach((fileName, index) => {
                const item = document.createElement('button');
                item.className = 'w-full text-left p-3 hover:bg-indigo-50 transition flex items-center space-x-3 group border-b border-gray-50 last:border-none';
                item.innerHTML = `
                    <div class="bg-red-50 text-red-500 p-2 rounded-lg group-hover:bg-indigo-100 group-hover:text-indigo-600 transition shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-700 truncate group-hover:text-indigo-600" title="${fileName}">${fileName}</p>
                        <span class="text-xs text-gray-400">點擊線上閱讀</span>
                    </div>
                `;

                // 綁定點擊事件開啟 PDF
                item.addEventListener('click', () => {
                    openPDF(FOLDER_PATH + encodeURIComponent(fileName), fileName);
                    
                    // 高亮當前選中的項目
                    document.querySelectorAll('#pdf-list button').forEach(b => b.classList.remove('bg-indigo-50', 'border-l-4', 'border-indigo-600'));
                    item.classList.add('bg-indigo-50', 'border-l-4', 'border-indigo-600');
                });

                listContainer.appendChild(item);
            });

            // 預設自動打開第一個檔案
            if (files.length > 0) {
                listContainer.children[0].click();
            }
        }

        // 開啟 PDF 檔案
        function openPDF(filePath, fileName) {
            const welcomeState = document.getElementById('welcome-state');
            const pdfViewer = document.getElementById('pdf-viewer');

            welcomeState.classList.add('hidden');
            pdfViewer.classList.remove('hidden');
            pdfViewer.src = filePath;
        }

        // 手動套用文字框清單
        function applyManualList() {
            const textarea = document.getElementById('manual-list-input');
            const lines = textarea.value.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0 && line.toLowerCase().endsWith('.pdf'));
            
            renderFileList(lines);
        }

        // 頁面載入後執行
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
