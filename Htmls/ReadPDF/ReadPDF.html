<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 線上閱讀器</title>
    <!-- Tailwind CSS 樣式框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- 頂部標題列 -->
    <header class="bg-indigo-600 text-white shadow-md px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <!-- 手機版切換按鈕 -->
            <button id="sidebar-toggle" class="md:hidden p-1.5 rounded-lg bg-indigo-700 hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="flex items-center space-x-2">
                <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <h1 class="text-base sm:text-xl font-bold tracking-wide truncate">PDF 閱讀平台</h1>
            </div>
        </div>
        <div class="text-xs sm:text-sm bg-indigo-700 px-2.5 sm:px-3 py-1 rounded-full shadow-inner hidden xs:block">
            路徑：<code class="font-mono">./PDF/</code>
        </div>
    </header>

    <!-- 主內容區 -->
    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- 手機版遮罩背景 -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

        <!-- 左側：PDF 檔案清單 -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-30 w-80 bg-white border-r border-gray-200 flex flex-col shrink-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl md:shadow-none">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    檔案清單
                </h2>
                <div class="flex items-center space-x-2">
                    <span id="file-count" class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium">0 個檔案</span>
                    <!-- 手機版關閉按鈕 -->
                    <button id="sidebar-close" class="md:hidden text-gray-400 hover:text-gray-600 p-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>

            <!-- 清單項目容器 -->
            <div id="pdf-list" class="flex-1 overflow-y-auto divide-y divide-gray-100 p-2">
                <!-- 動態載入項目 -->
            </div>
        </aside>

        <!-- 右側：PDF 預覽檢視器 -->
        <main class="flex-1 bg-gray-100 flex flex-col relative overflow-hidden w-full">
            <!-- 預設提示狀態 -->
            <div id="welcome-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 p-6 text-center">
                <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-lg font-medium text-gray-600">請從左側選擇一個 PDF 檔案開始閱讀</p>
                <p class="text-sm text-gray-400 mt-1">手機版可點擊左上角「選單按鈕」開啟檔案清單</p>
            </div>

            <!-- PDF 嵌入 iframe -->
            <iframe id="pdf-viewer" class="w-full h-full border-none hidden" title="PDF Viewer"></iframe>
        </main>
    </div>

    <!-- 邏輯運作 Script -->
    <script>
        const FOLDER_PATH = './PDF/';
        
        // 🎯 在這裡直接定義你的 01~10 檔案清單
        // 日後如果改了檔名，直接在這裡修改文字即可
        const pdfFiles = [
            '01.pdf',
            '02.pdf',
            '03.pdf',
            '04.pdf',
            '05.pdf',
            '06.pdf',
            '07.pdf',
            '08.pdf',
            '09.pdf',
            '10.pdf'
        ];

        // 手機版側邊欄控制
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarClose = document.getElementById('sidebar-close');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }

        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarClose.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        function init() {
            renderFileList(pdfFiles);
        }

        // 渲染檔案清單到畫面上
        function renderFileList(files) {
            const listContainer = document.getElementById('pdf-list');
            const fileCountBadge = document.getElementById('file-count');
            
            fileCountBadge.textContent = `${files.length} 個檔案`;
            listContainer.innerHTML = '';

            files.forEach((fileName) => {
                const item = document.createElement('button');
                item.className = 'w-full text-left p-3 hover:bg-indigo-50 transition flex items-center space-x-3 group border-b border-gray-50 last:border-none';
                item.innerHTML = `
                    <div class="bg-red-50 text-red-500 p-2 rounded-lg group-hover:bg-indigo-100 group-hover:text-indigo-600 transition shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-700 truncate group-hover:text-indigo-600" title="${fileName}">${fileName}</p>
                        <span class="text-xs text-gray-400">點擊線上閱讀</span>
                    </div>
                `;

                // 點擊事件
                item.addEventListener('click', () => {
                    openPDF(FOLDER_PATH + encodeURIComponent(fileName));
                    
                    // 高亮當前選擇項目
                    document.querySelectorAll('#pdf-list button').forEach(b => b.classList.remove('bg-indigo-50', 'border-l-4', 'border-indigo-600'));
                    item.classList.add('bg-indigo-50', 'border-l-4', 'border-indigo-600');

                    // 手機版點擊檔案後自動收起選單
                    if (window.innerWidth < 768) {
                        toggleSidebar();
                    }
                });

                listContainer.appendChild(item);
            });

            // 預設自動打開第一個檔案（僅電腦版或大螢幕自動載入）
            if (files.length > 0 && window.innerWidth >= 768) {
                listContainer.children[0].click();
            }
        }

        // 開啟 PDF 檔案
        function openPDF(filePath) {
            const welcomeState = document.getElementById('welcome-state');
            const pdfViewer = document.getElementById('pdf-viewer');

            welcomeState.classList.add('hidden');
            pdfViewer.classList.remove('hidden');
            pdfViewer.src = filePath;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
